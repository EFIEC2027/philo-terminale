<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz · Philosophie</title>
<link rel="icon" href="logo-efi.png">
<link rel="stylesheet" href="style.css?v=20261115c">
<style>
body { min-height: 100vh; }
.ecran { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
.centre { text-align: center; display: grid; gap: 14px; justify-items: center; }
.consignes ul { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; }
.barre-quiz { position: sticky; top: 0; z-index: 5; background: var(--papier); border-bottom: 1px solid var(--trait); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.barre-quiz .titre { font-family: var(--f-titre); font-weight: 700; flex: 1; min-width: 180px; }
.chrono { font-variant-numeric: tabular-nums; font-weight: 800; padding: .25rem .6rem; border-radius: 8px; background: var(--info-doux); }
.chrono.bientot { background: var(--ko-doux); color: var(--ko); }
.avance { color: var(--doux); font-size: .92rem; }
.navq { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
.navq button { width: 38px; height: 38px; border-radius: 9px; border: 1.5px solid var(--trait); background: var(--papier); font: inherit; font-weight: 700; cursor: pointer; color: var(--encre); }
.navq button.repondu { background: var(--accent-doux); border-color: var(--accent); }
.navq button.actif { background: var(--accent); border-color: var(--accent); color: #fff; }
.navq button.bonus { border-color: var(--or); }
.question { user-select: none; -webkit-user-select: none; }
.question .num { color: var(--accent); font-weight: 800; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
.question h2 { font-size: 1.35rem; margin: 6px 0 16px; }
.choix { display: grid; gap: 10px; }
.choix button { text-align: left; padding: .85rem 1rem; border: 2px solid var(--trait); border-radius: 12px; background: var(--papier); font: inherit; color: var(--encre); cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
.choix button:hover { border-color: var(--accent); }
.choix button .lettre { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--trait); display: grid; place-items: center; font-weight: 800; font-size: .9rem; }
.choix button.coche { border-color: var(--accent); background: var(--accent-doux); }
.choix button.coche .lettre { background: var(--accent); border-color: var(--accent); color: #fff; }
.pied-q { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
.voile { position: fixed; inset: 0; z-index: 50; background: rgba(29, 34, 48, .96); display: grid; place-items: center; padding: 16px; }
.voile .carte { max-width: 460px; width: 100%; display: grid; gap: 12px; text-align: center; }
.voile .stop { font-family: var(--f-titre); font-size: 1.6rem; color: var(--ko); margin: 0; }
.grosse-note { font-family: var(--f-titre); font-size: 4rem; font-weight: 700; color: var(--accent); line-height: 1; margin: 0; }
.grosse-note small { font-size: .4em; color: var(--doux); }
.cor { border: 1px solid var(--trait); border-radius: 12px; padding: 12px 14px; background: var(--papier); display: grid; gap: 6px; }
.cor.ok { border-left: 6px solid var(--ok); } .cor.ko { border-left: 6px solid var(--ko); }
.cor p { margin: 0; }
.cor .rep { font-size: .93rem; }
.cor .bon { color: var(--ok); font-weight: 700; }
.cor .faux { color: var(--ko); text-decoration: line-through; }
.cor .expl { color: var(--doux); font-size: .92rem; }
</style>
</head>
<body>
<div class="demo" id="demo" hidden>Mode démonstration : rien n'est enregistré.</div>

<!-- Messages -->
<section class="ecran centre" id="ecran-info">
  <img src="logo-efi.png" alt="" style="height:56px">
  <h1 id="info-titre">Chargement…</h1>
  <p id="info-texte" style="margin:0"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="bouton" id="b-reessayer" type="button" hidden>Réessayer</button><a class="bouton" href="index.html">Retour à l'accueil</a></div>
</section>

<!-- Consignes -->
<section class="ecran" id="ecran-consignes" hidden>
  <div class="carte consignes pile">
    <div><p class="surtitre" id="cs-type"></p><h1 id="cs-titre"></h1><p class="note-info" id="cs-eleve"></p></div>
    <ul id="cs-regles"></ul>
    <button class="bouton plein grand" id="b-commencer" type="button">Commencer</button>
  </div>
</section>

<!-- Quiz -->
<section id="ecran-quiz" hidden>
  <div class="barre-quiz">
    <span class="titre" id="q-titre-quiz"></span>
    <span class="avance" id="q-avance"></span>
    <span class="chrono" id="q-chrono">--:--</span>
    <button class="bouton plein" id="b-rendre" type="button">Rendre</button>
  </div>
  <div class="ecran" style="padding-top:8px">
    <div class="navq" id="navq"></div>
    <article class="carte question" id="question"></article>
    <div class="pied-q"><button class="bouton" id="b-prec" type="button">← Précédente</button><button class="bouton" id="b-suiv" type="button">Suivante →</button></div>
  </div>
</section>

<!-- Fin -->
<section class="ecran" id="ecran-fin" hidden>
  <div class="carte centre">
    <p class="surtitre" id="fin-type"></p>
    <h1 id="fin-titre"></h1>
    <p class="grosse-note"><span id="fin-note">–</span><small> / 20</small></p>
    <p id="fin-texte" style="margin:0"></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="bouton plein" id="b-refaire" href="#" hidden>Refaire un quiz</a><a class="bouton" href="index.html">Retour à l'accueil</a></div>
  </div>
  <div class="pile" id="fin-correction" style="margin-top:16px"></div>
</section>

<!-- Confirmation du rendu -->
<div class="voile" id="confirmer" hidden><div class="carte"><h2 style="margin:0">Rendre le quiz ?</h2><p id="cf-texte" style="margin:0"></p><div style="display:flex;gap:10px;justify-content:center"><button class="bouton" id="b-annuler" type="button">Continuer le quiz</button><button class="bouton plein" id="b-rendre-ok" type="button">Rendre</button></div></div></div>

<!-- Sortie du quiz -->
<div class="voile" id="voile-sortie" hidden><div class="carte" id="voile-contenu"></div></div>

<script src="config.js?v=20261115c"></script>
<script src="commun.js?v=20261115c"></script>
<script src="quiz-entrainement.js?v=20261115c"></script>
<script src="evaluations.js?v=20261115c"></script>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const MODE = params.get("mode") === "note" ? "note" : "entr";
const S = { questions: [], reponses: {}, idx: 0, actif: false, termine: false, decalage: 0, debut: null, rendant: false };
const ecrans = ["ecran-info", "ecran-consignes", "ecran-quiz", "ecran-fin"];
const montrer = id => { ecrans.forEach(e => $(e).hidden = e !== id); window.scrollTo(0, 0); };
const maintenant = () => Date.now() + S.decalage;
function info(titre, texte, reessayer) { $("info-titre").textContent = titre; $("info-texte").textContent = texte || ""; $("b-reessayer").hidden = !reessayer; montrer("ecran-info"); }
if (P.DEMO) $("demo").hidden = false;
const eleve = P.session();
if (!eleve) location.replace("index.html");

/* ---------- Plein écran et surveillance des sorties ---------- */
async function pleinEcran() { try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch {} }
function quitterPleinEcran() { try { if (document.fullscreenElement) document.exitFullscreen(); } catch {} }
let minuterieBlur = null;
document.addEventListener("visibilitychange", () => { if (document.hidden) sortie("Tu as changé d'onglet ou d'application."); });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) sortie("Tu es sorti(e) du plein écran."); });
// Fenêtre quittée (autre application à côté, second écran) : seulement si la page avait bien le focus.
let focusVu = document.hasFocus();
window.addEventListener("blur", () => { if (!focusVu) return; clearTimeout(minuterieBlur); minuterieBlur = setTimeout(() => { if (!document.hasFocus()) sortie("Tu as quitté la fenêtre du quiz."); }, 1500); });
window.addEventListener("focus", () => { focusVu = true; clearTimeout(minuterieBlur); });
document.addEventListener("contextmenu", e => { if (S.actif) e.preventDefault(); });
document.addEventListener("copy", e => { if (S.actif) e.preventDefault(); });
window.addEventListener("beforeunload", e => { if (S.actif) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("pagehide", () => {
  if (!S.actif || P.DEMO) return;
  const corps = MODE === "note" ? { action: "evalEvenement", id: eleve.id, code: eleve.code, quiz: S.meta.id, type: "incident", contenu: "page quittée" }
                                : { action: "entrainement", id: eleve.id, code: eleve.code, quiz: S.meta.id, resultat: { abandon: true, duree: (Date.now() - S.debut) / 1000 } };
  try { navigator.sendBeacon(P.URL_SERVEUR, new Blob([JSON.stringify(corps)], { type: "text/plain;charset=utf-8" })); } catch {}
});

function sortie(raison) {
  if (!S.actif || S.termine) return;
  S.actif = false;
  clearTimeout(minuterieBlur);
  if (MODE === "entr") abandon(raison); else bloquer(raison, true);
}

/* ---------- Affichage du quiz ---------- */
function nbRepondues() { return S.questions.filter(q => S.reponses[q.id] !== undefined).length; }
function dessinerNav() {
  $("navq").innerHTML = "";
  S.questions.forEach((q, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = q.bonus ? "★" : String(i + 1);
    b.className = (S.reponses[q.id] !== undefined ? "repondu " : "") + (i === S.idx ? "actif " : "") + (q.bonus ? "bonus" : "");
    b.title = q.bonus ? "Question bonus" : "Question " + (i + 1);
    b.addEventListener("click", () => afficher(i));
    $("navq").appendChild(b);
  });
  $("q-avance").textContent = `${nbRepondues()} / ${S.questions.length} répondues`;
}
function afficher(i) {
  S.idx = Math.max(0, Math.min(S.questions.length - 1, i));
  const q = S.questions[S.idx], z = $("question");
  z.innerHTML = `<p class="num">${q.bonus ? "★ Question bonus · 1 point en plus" : `Question ${S.idx + 1} / ${S.questions.length - 1} · 1 point`}</p><h2></h2><div class="choix"></div>`;
  z.querySelector("h2").textContent = q.q.replace(/^BONUS — /, "");
  q.choix.forEach((c, k) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = S.reponses[q.id] === c ? "coche" : "";
    b.innerHTML = `<span class="lettre">${"ABCD"[k]}</span><span></span>`; b.lastChild.textContent = c;
    b.addEventListener("click", () => { S.reponses[q.id] = c; memoriser(); afficher(S.idx); });
    z.querySelector(".choix").appendChild(b);
  });
  $("b-prec").disabled = S.idx === 0;
  $("b-suiv").textContent = S.idx === S.questions.length - 1 ? "Rendre →" : "Suivante →";
  dessinerNav();
}
$("b-prec").addEventListener("click", () => afficher(S.idx - 1));
$("b-suiv").addEventListener("click", () => S.idx === S.questions.length - 1 ? demanderRendu() : afficher(S.idx + 1));
function demanderRendu() {
  const n = nbRepondues(), t = S.questions.length;
  $("cf-texte").textContent = n < t ? `Tu as répondu à ${n} question${n > 1 ? "s" : ""} sur ${t}. Les questions sans réponse comptent 0.` : "Tu as répondu à toutes les questions.";
  $("confirmer").hidden = false;
}
$("b-rendre").addEventListener("click", demanderRendu);
$("b-annuler").addEventListener("click", () => { $("confirmer").hidden = true; });
$("b-rendre-ok").addEventListener("click", () => { $("confirmer").hidden = true; rendre(false); });

/* ---------- Chronomètre ---------- */
function mmss(ms) { const s = Math.max(0, Math.round(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
setInterval(() => {
  if (!S.debut || S.termine || $("ecran-quiz").hidden) return;
  if (MODE === "entr") { $("q-chrono").textContent = mmss(Date.now() - S.debut); return; }
  const reste = S.debut + S.meta.duree * 60000 - maintenant();
  $("q-chrono").textContent = mmss(reste);
  $("q-chrono").classList.toggle("bientot", reste < 3 * 60000);
  if (reste <= 0 && S.actif) rendre(true);
}, 500);

/* ---------- Correction ---------- */
function correction(res) {
  const z = $("fin-correction"); z.innerHTML = "";
  S.questions.forEach((q, i) => {
    const r = S.reponses[q.id], ok = r === q.bonne;
    const a = document.createElement("article"); a.className = "cor " + (ok ? "ok" : "ko");
    a.innerHTML = `<p class="surtitre" style="color:${ok ? "var(--ok)" : "var(--ko)"}">${q.bonus ? "★ Bonus" : "Question " + (i + 1)} · ${ok ? "juste" : "faux"}</p><p><b></b></p><p class="rep"></p><p class="expl"></p>`;
    a.querySelector("b").textContent = q.q.replace(/^BONUS — /, "");
    const rep = a.querySelector(".rep");
    if (!ok) { const f = document.createElement("span"); f.className = "faux"; f.textContent = r === undefined ? "(pas de réponse)" : r; rep.append("Ta réponse : ", f, document.createElement("br")); }
    const bon = document.createElement("span"); bon.className = "bon"; bon.textContent = q.bonne; rep.append("Bonne réponse : ", bon);
    a.querySelector(".expl").textContent = q.x || "";
    z.appendChild(a);
  });
}

/* ================= ENTRAÎNEMENT (non noté) ================= */
function preparerEntr() {
  S.meta = (window.QUIZ_ENTRAINEMENT || []).find(q => q.id === params.get("q"));
  if (!S.meta) return info("Quiz introuvable", "Retourne à l'accueil et choisis un quiz.");
  $("cs-type").innerHTML = 'Quiz d\'entraînement · <span class="etiquette libre">non noté</span>';
  $("cs-titre").textContent = S.meta.titre;
  $("cs-eleve").textContent = `${eleve.prenom || eleve.id} · ${eleve.classe}`;
  $("cs-regles").innerHTML = `<li>20 questions à 1 point, plus <b>1 question bonus</b> (★) à 1 point.</li><li>Temps conseillé : ${S.meta.duree} minutes. Ce quiz n'est pas noté : tu verras la correction expliquée à la fin.</li><li><b>Tu ne peux pas quitter le quiz</b> : si tu changes d'onglet, d'application ou sors du plein écran, le quiz est <b>annulé</b> et tu dois recommencer.</li>`;
  $("b-commencer").textContent = "Commencer (plein écran)";
  $("b-commencer").onclick = demarrerEntr;
  montrer("ecran-consignes");
}
async function demarrerEntr() {
  const alea = P.generateur(P.graine(eleve.id + Date.now() + Math.random()));
  S.questions = P.tirer(S.meta.tirage, window.BANQUES, alea);
  S.reponses = {}; S.termine = false; S.rendant = false;
  await pleinEcran();
  S.debut = Date.now(); S.actif = true;
  $("q-titre-quiz").textContent = S.meta.titre; $("q-chrono").classList.remove("bientot");
  montrer("ecran-quiz"); afficher(0);
}
function memoriser() { if (MODE === "note") sauvegarder(); }
function abandon(raison) {
  quitterPleinEcran();
  if (!P.DEMO) P.post({ action: "entrainement", id: eleve.id, code: eleve.code, quiz: S.meta.id, resultat: { abandon: true, duree: (Date.now() - S.debut) / 1000 } }).catch(() => {});
  $("voile-contenu").innerHTML = `<p class="stop">Quiz annulé</p><p style="margin:0"></p><p class="note-info" style="margin:0">Pendant un quiz, on reste sur la page en plein écran.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="bouton plein" id="b-recommencer" type="button">Recommencer</button><a class="bouton" href="index.html">Retour à l'accueil</a></div>`;
  $("voile-contenu").children[1].textContent = raison + " Ce quiz est annulé.";
  $("voile-sortie").hidden = false;
  $("b-recommencer").onclick = () => { $("voile-sortie").hidden = true; demarrerEntr(); };
}

/* ================= QUIZ NOTÉ ================= */
const cleLocale = () => `philo:note:${eleve.id}:${S.meta.id}`;
async function preparerNote() {
  if (P.DEMO) return info("Mode démonstration", "Le quiz noté a besoin du script Google (config.js).");
  info("Chargement…", "");
  let d;
  try { d = await P.get({ action: "evalEtat", id: eleve.id, code: eleve.code }); }
  catch { return info("Connexion impossible", "Vérifie Internet, puis réessaie.", true); }
  if (!d.ok && d.erreur === "code_a_changer") return info("Choisis d'abord ton code", "Va sur la page d'accueil et connecte-toi : tu dois choisir ton code personnel.");
  if (!d.ok) { P.local.suppr("philo:session"); return info("Reconnecte-toi", "Ton identifiant ou ton code a changé. Retourne à l'accueil."); }
  if (!d.quiz) return info("Pas de quiz noté ouvert", `Bonjour ${d.prenom}. Ton professeur n'a pas encore ouvert le quiz pour ta classe. Attends son signal, puis clique sur Réessayer.`, true);
  S.meta = (window.QUIZ_NOTES || []).find(q => q.id === d.quiz.id);
  if (!S.meta) return info("Page à mettre à jour", "Appuie sur Ctrl + F5 (ou recharge la page). Si le problème continue, préviens ton professeur.", true);
  if (d.quiz.rendu) return info("Quiz déjà rendu", d.quiz.note !== null ? `Ta note : ${P.virgule(d.quiz.note)} / 20.` : "Tu as déjà rendu ce quiz.");
  let contenu;
  try { contenu = await P.dechiffrer(S.meta, d.quiz.cle); } catch { return info("Page à mettre à jour", "Appuie sur Ctrl + F5 pour recharger la page.", true); }
  S.questions = P.tirer(contenu.tirage, contenu.banques, P.generateur(P.graine(eleve.id + ":" + S.meta.id)));
  S.decalage = d.maintenant - Date.now();
  S.debut = d.quiz.debut;
  const serv = d.quiz.reponses && d.quiz.reponses.version === S.meta.iv ? d.quiz.reponses.reponses || {} : {};
  const loc = P.local.lire(cleLocale(), {});
  S.reponses = Object.assign({}, serv, loc.version === S.meta.iv ? loc.reponses || {} : {});
  S.verrouille = !!d.quiz.verrouille;
  $("cs-type").innerHTML = 'Quiz <span class="etiquette note">noté</span>';
  $("cs-titre").textContent = S.meta.titre;
  $("cs-eleve").textContent = `${d.prenom} · ${d.classe}`;
  $("cs-regles").innerHTML = `<li>20 questions à 1 point, plus <b>1 question bonus</b> (★) à 1 point. La note est sur 20.</li><li><b>${S.meta.duree} minutes</b> à partir du moment où tu commences. À la fin du temps, le quiz est rendu automatiquement.</li><li>Tes réponses sont enregistrées au fur et à mesure.</li><li><b>Tu ne peux pas quitter le quiz.</b> Si tu changes d'onglet, d'application ou sors du plein écran, ton quiz est <b>bloqué</b> et ton professeur est prévenu : lui seul peut le débloquer.</li><li>Chacun a ses propres questions, dans un ordre différent.</li>`;
  $("b-commencer").textContent = S.debut ? "Reprendre le quiz (plein écran)" : "Commencer le quiz (plein écran)";
  $("b-commencer").onclick = demarrerNote;
  montrer("ecran-consignes");
}
async function demarrerNote() {
  $("b-commencer").disabled = true;
  await pleinEcran();
  if (!S.debut) {
    try {
      const r = await P.post({ action: "evalEvenement", id: eleve.id, code: eleve.code, quiz: S.meta.id, type: "debut" });
      if (!r.ok) { $("b-commencer").disabled = false; quitterPleinEcran(); return info(r.erreur === "ferme" ? "Quiz fermé" : "Impossible de commencer", r.erreur === "ferme" ? "Ton professeur a fermé ce quiz." : "Réessaie.", true); }
      S.debut = r.debut;
    } catch { $("b-commencer").disabled = false; quitterPleinEcran(); return info("Connexion impossible", "Vérifie Internet, puis réessaie.", true); }
  }
  $("b-commencer").disabled = false;
  $("q-titre-quiz").textContent = S.meta.titre;
  montrer("ecran-quiz"); afficher(0);
  if (S.verrouille) bloquer("Ton quiz a été bloqué parce que tu en es sorti(e).", false);
  else S.actif = true;
}
let minuterieSauvegarde = null;
function sauvegarder() {
  P.local.ecrire(cleLocale(), { version: S.meta.iv, reponses: S.reponses });
  clearTimeout(minuterieSauvegarde);
  minuterieSauvegarde = setTimeout(() => {
    P.post({ action: "evalEvenement", id: eleve.id, code: eleve.code, quiz: S.meta.id, type: "sauvegarde", contenu: JSON.stringify({ version: S.meta.iv, reponses: S.reponses }) }).catch(() => {});
  }, 1500);
}
function bloquer(raison, signaler) {
  quitterPleinEcran();
  if (signaler) P.post({ action: "evalEvenement", id: eleve.id, code: eleve.code, quiz: S.meta.id, type: "incident", contenu: raison }).catch(() => {});
  $("voile-contenu").innerHTML = `<p class="stop">Quiz bloqué</p><p style="margin:0"></p><p style="margin:0"><b>Appelle ton professeur.</b> Lui seul peut débloquer ton quiz. Le temps continue de tourner.</p><label class="champ" style="text-align:left">Code du professeur<input type="password" id="v-code" autocomplete="off"></label><p class="erreur" id="v-erreur" hidden></p><button class="bouton plein" id="b-debloquer" type="button">Débloquer</button>`;
  $("voile-contenu").children[1].textContent = raison;
  $("voile-sortie").hidden = false;
  $("b-debloquer").onclick = async () => {
    $("b-debloquer").disabled = true; $("v-erreur").hidden = true;
    try {
      const r = await P.post({ action: "debloquer", id: eleve.id, code: eleve.code, quiz: S.meta.id, cle: $("v-code").value });
      if (r.ok) { $("voile-sortie").hidden = true; await pleinEcran(); S.actif = true; }
      else { $("v-erreur").textContent = "Code incorrect."; $("v-erreur").hidden = false; }
    } catch { $("v-erreur").textContent = "Connexion impossible. Réessaie."; $("v-erreur").hidden = false; }
    $("b-debloquer").disabled = false;
  };
}

/* ---------- Rendu ---------- */
async function rendre(auto) {
  if (S.termine || S.rendant) return;
  S.rendant = true; S.actif = false;
  const res = P.corriger(S.questions, S.reponses);
  quitterPleinEcran();
  if (MODE === "entr") {
    S.termine = true;
    if (!P.DEMO) P.post({ action: "entrainement", id: eleve.id, code: eleve.code, quiz: S.meta.id,
      resultat: { note20: res.note20, bonnes: res.bonnes, bonus: res.bonus, duree: (Date.now() - S.debut) / 1000, detail: res.faux } }).catch(() => {});
    $("fin-type").innerHTML = 'Quiz d\'entraînement · <span class="etiquette libre">non noté</span>';
    $("fin-titre").textContent = S.meta.titre;
    $("fin-note").textContent = P.virgule(res.note20);
    $("fin-texte").textContent = `${res.bonnes} bonne${res.bonnes > 1 ? "s" : ""} réponse${res.bonnes > 1 ? "s" : ""} sur 20${res.bonus ? " + le bonus" : ""}. Relis la correction ci-dessous, surtout les explications.`;
    $("b-refaire").hidden = false; $("b-refaire").href = "quiz.html?q=" + encodeURIComponent(S.meta.id);
    correction(res);
    montrer("ecran-fin");
    return;
  }
  info("Envoi de ton quiz…", "Ne ferme pas la page tant que ce message est affiché.");
  const contenu = JSON.stringify({ note20: res.note20, bonnes: res.bonnes, bonus: res.bonus, faux: res.faux, reponses: S.reponses, auto });
  for (let essai = 0; ; essai++) {
    try {
      const r = await P.post({ action: "evalEvenement", id: eleve.id, code: eleve.code, quiz: S.meta.id, type: "rendu", contenu });
      if (r.ok) break;
    } catch {}
    info("Envoi en attente…", "La connexion a échoué. Nouvel essai dans quelques secondes : ne ferme pas la page.");
    await new Promise(ok => setTimeout(ok, Math.min(15000, 3000 + essai * 2000)));
  }
  S.termine = true;
  P.local.suppr(cleLocale());
  $("fin-type").innerHTML = 'Quiz <span class="etiquette note">noté</span>';
  $("fin-titre").textContent = "Quiz rendu" + (auto ? " (temps écoulé)" : "");
  $("fin-note").textContent = P.virgule(res.note20);
  $("fin-texte").textContent = `${res.bonnes} bonne${res.bonnes > 1 ? "s" : ""} réponse${res.bonnes > 1 ? "s" : ""} sur 20${res.bonus ? ", et le bonus est juste" : ""}. Ta note est enregistrée. La correction sera faite en classe.`;
  montrer("ecran-fin");
}

$("b-reessayer").addEventListener("click", () => MODE === "note" ? preparerNote() : preparerEntr());
if (eleve) MODE === "note" ? preparerNote() : preparerEntr();
</script>
